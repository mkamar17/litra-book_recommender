stages:
  - build
  - test
  - jacoco
  - checkstyle
  - spotbugs

cache:
  paths:
    - .m2/repository

build:
  stage: build
  script:
    - cd product/Backend
    - mvn compile

test:
  stage: test
  script:
    - cd product/Backend
    - mvn test -Dspring.profiles.active=ci
  artifacts:
    paths:
      - Backend/target/jacoco.exec

jacoco:
  stage: jacoco
  dependencies:
    - test
  script:
    - cd product/Backend
    - mvn verify -Dspring.profiles.active=ci

checkstyle:
  stage: checkstyle
  script:
    - cd product/Backend
    - mvn checkstyle:check

spotbugs:
  stage: spotbugs
  script:
    - cd product/Backend
    - mvn spotbugs:check
